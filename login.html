<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In &bull; ShopHub</title>
    <!-- Tailwind CSS (CDN - Zero build setup required) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between antialiased">

    <!-- Top Simple Nav -->
    <header class="w-full bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
        <a href="store.html" class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                S
            </div>
            <span class="font-bold text-xl tracking-tight text-slate-900">Shop<span class="text-indigo-600">Hub</span></span>
        </a>
        <a href="store.html" class="text-sm font-medium text-slate-600 hover:text-indigo-600 transition">
            Continue as Guest &rarr;
        </a>
    </header>

    <!-- Center Card -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-8">
        <div class="w-full max-w-md bg-white rounded-xl shadow-sm border border-slate-200 p-8">
            
            <!-- Tabs -->
            <div class="flex border-b border-slate-200 mb-6">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 pb-3 text-center border-b-2 border-indigo-600 text-indigo-600 font-semibold text-sm transition">
                    Sign In
                </button>
                <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 pb-3 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 font-medium text-sm transition">
                    Create Account
                </button>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
                    <input type="text" id="login-username" required placeholder="Enter username" value="admin" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
                    </div>
                    <input type="password" id="login-password" required placeholder="••••••••" value="admin123" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition">
                </div>

                <div class="flex items-center justify-between text-xs text-slate-500 pt-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="text-indigo-600 hover:underline">Forgot password?</a>
                </div>

                <button type="submit" id="btn-login-submit" class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm transition shadow-sm flex items-center justify-center gap-2">
                    <span>Sign In</span>
                </button>
            </form>

            <!-- Register Form -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3.5 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                    <input type="text" id="reg-username" required placeholder="e.g. john_doe" class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="reg-password" required placeholder="Create password" class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
                    <input type="text" id="reg-name" required placeholder="e.g. John Doe" class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" id="reg-email" required placeholder="john@example.com" class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition">
                </div>

                <button type="submit" id="btn-reg-submit" class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm transition shadow-sm flex items-center justify-center gap-2 mt-2">
                    <span>Create Account</span>
                </button>
            </form>

            <!-- Error/Status Box -->
            <div id="auth-status" class="mt-4 p-3 rounded-lg text-xs hidden"></div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-white border-t border-slate-200 py-4 px-6 text-center text-xs text-slate-500">
        &copy; 2026 ShopHub E-Commerce Inc. All rights reserved.
    </footer>

    <script src="app.js"></script>
    <script>
        function switchAuthTab(mode) {
            const tabLogin = document.getElementById("tab-login");
            const tabRegister = document.getElementById("tab-register");
            const formLogin = document.getElementById("form-login");
            const formRegister = document.getElementById("form-register");
            const statusDiv = document.getElementById("auth-status");
            statusDiv.classList.add("hidden");

            if (mode === 'login') {
                tabLogin.className = "flex-1 pb-3 text-center border-b-2 border-indigo-600 text-indigo-600 font-semibold text-sm transition";
                tabRegister.className = "flex-1 pb-3 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 font-medium text-sm transition";
                formLogin.classList.remove("hidden");
                formRegister.classList.add("hidden");
            } else {
                tabRegister.className = "flex-1 pb-3 text-center border-b-2 border-indigo-600 text-indigo-600 font-semibold text-sm transition";
                tabLogin.className = "flex-1 pb-3 text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 font-medium text-sm transition";
                formRegister.classList.remove("hidden");
                formLogin.classList.add("hidden");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById("login-username").value.trim();
            const password = document.getElementById("login-password").value.trim();
            const statusDiv = document.getElementById("auth-status");
            const btn = document.getElementById("btn-login-submit");

            btn.disabled = true;
            btn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span> Signing in...`;

            try {
                const res = await fetch(`${API_BASE}/auth/token`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    throw new Error("Invalid username or password.");
                }

                let token = "";
                const responseText = await res.text();
                try {
                    const data = JSON.parse(responseText);
                    token = data.token || data.jwt || (typeof data === 'string' ? data : '');
                } catch {
                    // AuthController returns raw JWT token string directly (text/plain)
                    token = responseText.trim();
                }

                if (!token) {
                    throw new Error("Invalid response received from auth server.");
                }

                // Fetch customer profile
                let customerId = "1";
                try {
                    const custRes = await fetch(`${API_BASE}/customers`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (custRes.ok) {
                        const customers = await custRes.json();
                        if (Array.isArray(customers) && customers.length > 0) {
                            const found = customers.find(c => c.name && c.name.toLowerCase().includes(username.toLowerCase()));
                            customerId = found ? found.id : customers[0].id;
                        }
                    }
                } catch(e) {}

                Auth.setSession(token, username, customerId);
                showToast("Signed in successfully!", "success");
                setTimeout(() => {
                    window.location.href = "store.html";
                }, 600);

            } catch (err) {
                statusDiv.classList.remove("hidden");
                statusDiv.className = "mt-4 p-3 rounded-lg text-xs bg-red-50 border border-red-200 text-red-700";
                statusDiv.textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Sign In</span>`;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById("reg-username").value.trim();
            const password = document.getElementById("reg-password").value.trim();
            const name = document.getElementById("reg-name").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const statusDiv = document.getElementById("auth-status");
            const btn = document.getElementById("btn-reg-submit");

            btn.disabled = true;
            btn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span> Registering...`;

            try {
                // Register in Auth
                const authRes = await fetch(`${API_BASE}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: username, username, password, email })
                });

                if (!authRes.ok) {
                    const text = await authRes.text();
                    throw new Error(text || "Registration failed.");
                }

                // Acquire token
                const tokenRes = await fetch(`${API_BASE}/auth/token`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                let token = "";
                if (tokenRes.ok) {
                    const tokenText = await tokenRes.text();
                    try {
                        const tData = JSON.parse(tokenText);
                        token = tData.token || tData.jwt || (typeof tData === 'string' ? tData : '');
                    } catch {
                        token = tokenText.trim();
                    }
                }

                // Create Customer record
                let customerId = "1";
                try {
                    const custRes = await fetch(`${API_BASE}/customers`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            ...(token ? { "Authorization": `Bearer ${token}` } : {})
                        },
                        body: JSON.stringify({ name, email })
                    });
                    if (custRes.ok) {
                        const custData = await custRes.json();
                        customerId = custData.id || "1";
                    }
                } catch(e) {}

                Auth.setSession(token, username, customerId);
                showToast("Account created successfully!", "success");
                setTimeout(() => {
                    window.location.href = "store.html";
                }, 800);

            } catch (err) {
                statusDiv.classList.remove("hidden");
                statusDiv.className = "mt-4 p-3 rounded-lg text-xs bg-red-50 border border-red-200 text-red-700";
                statusDiv.textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Create Account</span>`;
            }
        }
    </script>
</body>
</html>
