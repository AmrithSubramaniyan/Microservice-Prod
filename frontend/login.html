<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In &bull; ShoppingHub</title>
    <!-- Tailwind CSS (CDN - Zero build setup required) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-slate-100 min-h-screen text-slate-800 flex flex-col justify-between antialiased">

    <!-- Top Navigation Header -->
    <header class="w-full bg-white/80 backdrop-blur-md border-b border-slate-200/80 px-6 sm:px-12 py-4 flex items-center justify-between sticky top-0 z-30 shadow-xs">
        <a href="store.html" class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white font-extrabold text-xl shadow-md shadow-indigo-200">
                S
            </div>
            <div class="flex flex-col">
                <span class="font-extrabold text-xl tracking-tight text-slate-900 leading-none">Shopping<span class="text-indigo-600">Hub</span></span>
                <span class="text-[10px] font-semibold text-slate-400 tracking-wider uppercase mt-0.5">India's Modern Superstore</span>
            </div>
        </a>
        <a href="store.html" class="text-xs sm:text-sm font-semibold text-slate-600 hover:text-indigo-600 transition flex items-center gap-1.5 bg-slate-100 hover:bg-indigo-50 px-3.5 py-2 rounded-lg">
            <span>Explore as Guest</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </a>
    </header>

    <!-- Center Card -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-6">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 p-8 sm:p-10 relative overflow-hidden">
            
            <div class="mb-6 text-center">
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome to ShoppingHub</h1>
                <p class="text-xs text-slate-500 mt-1">Sign in to manage orders, track deliveries, and access deals</p>
            </div>

            <!-- Tabs -->
            <div class="flex bg-slate-100 p-1 rounded-xl mb-6 font-medium text-xs">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2.5 rounded-lg bg-white text-indigo-700 font-bold shadow-xs transition">
                    Sign In
                </button>
                <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 font-semibold transition">
                    Create Account
                </button>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
                    <input type="text" id="login-username" required placeholder="Enter username" value="admin" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-50 outline-none text-sm transition">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
                        <a href="#" class="text-xs text-indigo-600 hover:underline font-semibold">Forgot?</a>
                    </div>
                    <input type="password" id="login-password" required placeholder="••••••••" value="admin123" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-50 outline-none text-sm transition">
                </div>

                <div class="flex items-center gap-2 pt-1 text-xs text-slate-600">
                    <input type="checkbox" id="remember" checked class="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300">
                    <label for="remember" class="cursor-pointer font-medium">Keep me signed in</label>
                </div>

                <button type="submit" id="btn-login-submit" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold text-sm transition shadow-md shadow-indigo-200 flex items-center justify-center gap-2 mt-2">
                    <span>Sign In to ShoppingHub</span>
                </button>
            </form>

            <!-- Register Form -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3.5 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                    <input type="text" id="reg-username" required placeholder="e.g. rahul_kumar" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-50 outline-none text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="reg-password" required placeholder="Create secure password" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-50 outline-none text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
                    <input type="text" id="reg-name" required placeholder="e.g. Rahul Kumar" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-50 outline-none text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" id="reg-email" required placeholder="rahul@example.in" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-600 focus:ring-4 focus:ring-indigo-50 outline-none text-sm transition">
                </div>

                <button type="submit" id="btn-reg-submit" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold text-sm transition shadow-md shadow-indigo-200 flex items-center justify-center gap-2 mt-2">
                    <span>Create Free Account</span>
                </button>
            </form>

            <!-- Status Alert -->
            <div id="auth-status" class="mt-4 p-3 rounded-xl text-xs font-medium hidden"></div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-white border-t border-slate-200 py-4 px-6 text-center text-xs text-slate-400">
        &copy; 2026 ShoppingHub Internet Private Limited &bull; All transactions secured via 256-bit encryption
    </footer>

    <script src="app.js"></script>
    <script>
        function switchAuthTab(mode) {
            const tabLogin = document.getElementById("tab-login");
            const tabRegister = document.getElementById("tab-register");
            const formLogin = document.getElementById("form-login");
            const formRegister = document.getElementById("form-register");
            const statusDiv = document.getElementById("auth-status");
            statusDiv.classList.add("hidden");

            if (mode === 'login') {
                tabLogin.className = "flex-1 py-2.5 rounded-lg bg-white text-indigo-700 font-bold shadow-xs transition";
                tabRegister.className = "flex-1 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 font-semibold transition";
                formLogin.classList.remove("hidden");
                formRegister.classList.add("hidden");
            } else {
                tabRegister.className = "flex-1 py-2.5 rounded-lg bg-white text-indigo-700 font-bold shadow-xs transition";
                tabLogin.className = "flex-1 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 font-semibold transition";
                formRegister.classList.remove("hidden");
                formLogin.classList.add("hidden");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById("login-username").value.trim();
            const password = document.getElementById("login-password").value.trim();
            const statusDiv = document.getElementById("auth-status");
            const btn = document.getElementById("btn-login-submit");

            btn.disabled = true;
            btn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span> Verifying...`;

            try {
                const res = await fetch(`${API_BASE}/auth/token`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                if (!res.ok) {
                    throw new Error("Invalid username or password.");
                }

                let token = "";
                const responseText = await res.text();
                try {
                    const data = JSON.parse(responseText);
                    token = data.token || data.jwt || (typeof data === 'string' ? data : '');
                } catch {
                    token = responseText.trim();
                }

                if (!token) {
                    throw new Error("Invalid token received from server.");
                }

                // Fetch customer ID
                let customerId = "1";
                try {
                    const custRes = await fetch(`${API_BASE}/customers`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    if (custRes.ok) {
                        const customers = await custRes.json();
                        if (Array.isArray(customers) && customers.length > 0) {
                            const found = customers.find(c => c.name && c.name.toLowerCase().includes(username.toLowerCase()));
                            customerId = found ? found.id : customers[0].id;
                        }
                    }
                } catch(e) {}

                Auth.setSession(token, username, customerId);
                showToast("Signed in successfully! Entering ShoppingHub...", "success");
                setTimeout(() => {
                    window.location.href = "store.html";
                }, 600);

            } catch (err) {
                statusDiv.classList.remove("hidden");
                statusDiv.className = "mt-4 p-3 rounded-xl text-xs bg-rose-50 border border-rose-200 text-rose-700";
                statusDiv.textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Sign In to ShoppingHub</span>`;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById("reg-username").value.trim();
            const password = document.getElementById("reg-password").value.trim();
            const name = document.getElementById("reg-name").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const statusDiv = document.getElementById("auth-status");
            const btn = document.getElementById("btn-reg-submit");

            btn.disabled = true;
            btn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span> Creating account...`;

            try {
                // Register in Auth
                const authRes = await fetch(`${API_BASE}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: username, username, password, email })
                });

                if (!authRes.ok) {
                    const text = await authRes.text();
                    throw new Error(text || "Registration failed.");
                }

                // Fetch token
                const tokenRes = await fetch(`${API_BASE}/auth/token`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                let token = "";
                if (tokenRes.ok) {
                    const tokenText = await tokenRes.text();
                    try {
                        const tData = JSON.parse(tokenText);
                        token = tData.token || tData.jwt || (typeof tData === 'string' ? tData : '');
                    } catch {
                        token = tokenText.trim();
                    }
                }

                // Create customer record
                let customerId = "1";
                try {
                    const custRes = await fetch(`${API_BASE}/customers`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            ...(token ? { "Authorization": `Bearer ${token}` } : {})
                        },
                        body: JSON.stringify({ name, email })
                    });
                    if (custRes.ok) {
                        const custData = await custRes.json();
                        customerId = custData.id || "1";
                    }
                } catch(e) {}

                Auth.setSession(token, username, customerId);
                showToast("Account created successfully!", "success");
                setTimeout(() => {
                    window.location.href = "store.html";
                }, 800);

            } catch (err) {
                statusDiv.classList.remove("hidden");
                statusDiv.className = "mt-4 p-3 rounded-xl text-xs bg-rose-50 border border-rose-200 text-rose-700";
                statusDiv.textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Create Free Account</span>`;
            }
        }
    </script>
</body>
</html>
